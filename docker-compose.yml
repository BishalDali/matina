services:
  postgres:
    image: postgres:16-alpine
    container_name: matina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: matina
      POSTGRES_PASSWORD: matina_dev_password
      POSTGRES_DB: matina_db
    ports:
      - "5432:5432"
    volumes:
      - matina_pgdata:/var/lib/postgresql/data

volumes:
  matina_pgdata:
